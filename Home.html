<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home</title>

<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(135deg,#ff9966,#ff5e62);
  font-family:Arial;
  color:#fff;
  text-align:center;
}

.box{
  animation:fade 1s ease;
}

@keyframes fade{
  from{opacity:0;transform:scale(0.8)}
  to{opacity:1;transform:scale(1)}
}

a{
  display:inline-block;
  margin-top:20px;
  padding:10px 20px;
  background:#fff;
  color:#ff5e62;
  border-radius:10px;
  text-decoration:none;
}
</style>
</head>

<body>
<div class="box">
  <h1>Welcome 🎉</h1>
  <p>This is Home Page (UI Only)</p>
  <a href="login.html">Logout</a>
</div>
</body>
</html>
